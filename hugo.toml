languageCode = 'en-us'
title = 'Liyonverse Blog'
theme = 'terminal'

pagination.pagerSize = 5

[markup.goldmark.renderer]
  unsafe = true

[params]
  contentTypeName = "posts"
  showMenuItems = 2
  fullWidthTheme = true
  centerTheme = false

[languages]
